<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Polling App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Smooth background gradient */
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
        }
        /* Custom scrollbar for options list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c7c7cc; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa; 
        }
        
        /* Smooth transitions */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 antialiased text-gray-800">

    <!-- Main Container -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden relative fade-in">
        
        <!-- Timer Display (Absolute top right, visible during voting) -->
        <div id="timer-display" class="hidden absolute top-4 right-6 bg-indigo-100 text-indigo-700 font-mono font-bold px-3 py-1.5 rounded-lg border border-indigo-200 shadow-sm z-10 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="timer-text">00:00</span>
        </div>

        <!-- Global Error Notification -->
        <div id="error-notification" class="hidden bg-red-100 text-red-700 px-4 py-3 text-sm font-medium transition-all duration-300 border-b border-red-200">
            Error message goes here
        </div>

        <!-- SCREEN 1: Loading -->
        <div id="screen-loading" class="p-12 text-center flex flex-col items-center justify-center min-h-[400px]">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-500 font-medium">Connecting to Poll...</p>
        </div>

        <!-- SCREEN 2: Host Setup -->
        <div id="screen-setup" class="hidden p-6 sm:p-8">
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 mb-1">Create a Poll</h1>
                <p class="text-sm text-gray-500">Configure options and timer for your audience.</p>
            </div>

            <div class="space-y-5">
                <!-- Question -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Poll Question</label>
                    <input type="text" id="setup-question" placeholder="e.g., What should we build next?" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>

                <!-- Options -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Options</label>
                    <div id="setup-options-list" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar pr-2 pb-2">
                        <!-- Options injected here -->
                    </div>
                    <button id="btn-add-option" class="mt-2 flex items-center text-sm text-indigo-600 font-medium hover:text-indigo-800 transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Add Option
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Type -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Vote Type</label>
                        <div class="flex flex-col gap-2">
                            <label class="flex items-center">
                                <input type="radio" name="poll-type" value="single" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300" checked>
                                <span class="ml-2 text-sm text-gray-700">Single Choice</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="poll-type" value="multiple" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="ml-2 text-sm text-gray-700">Multiple Choice</span>
                            </label>
                        </div>
                    </div>

                    <!-- Timer -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Duration</label>
                        <div class="flex gap-2">
                            <div class="flex-1">
                                <input type="number" id="setup-minutes" min="0" max="60" value="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center">
                                <div class="text-xs text-center text-gray-500 mt-1">Min</div>
                            </div>
                            <div class="flex items-center pb-5 font-bold">:</div>
                            <div class="flex-1">
                                <input type="number" id="setup-seconds" min="0" max="59" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center">
                                <div class="text-xs text-center text-gray-500 mt-1">Sec</div>
                            </div>
                        </div>
                    </div>
                </div>

                <button id="btn-start-poll" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-transform transform active:scale-95 flex justify-center items-center">
                    Start Poll
                </button>
            </div>
        </div>

        <!-- SCREEN 3: Voting -->
        <div id="screen-voting" class="hidden p-6 sm:p-8 pt-12">
            <h2 id="voting-question" class="text-2xl font-bold text-gray-900 mb-6 pr-20 leading-tight">Question goes here?</h2>
            
            <div id="voting-options-container" class="space-y-3 mb-8">
                <!-- Checkboxes or Radios injected here -->
            </div>

            <button id="btn-submit-vote" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-transform transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                Submit Vote
            </button>
        </div>

        <!-- SCREEN 4: Results -->
        <div id="screen-results" class="hidden p-6 sm:p-8 pt-10">
            <div class="flex items-center justify-between mb-6 pr-20">
                <h2 id="results-question" class="text-2xl font-bold text-gray-900 leading-tight">Question goes here?</h2>
            </div>
            
            <div class="mb-4">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                    Poll Closed
                </span>
                <span id="results-total-votes" class="ml-2 text-sm text-gray-500">0 Total Votes</span>
            </div>

            <div id="results-container" class="space-y-4 mb-8">
                <!-- Progress bars injected here -->
            </div>

            <button id="btn-reset-poll" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 px-4 rounded-lg shadow-sm transition-colors border border-gray-200">
                Create New Poll
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration & Initialization
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-poll-app';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Core State
        let currentUser = null;
        let currentPollData = null;
        let pollUnsubscribe = null;
        let timerInterval = null;
        
        // Setup State
        let setupOptions = [{ id: 'opt_1', text: '' }, { id: 'opt_2', text: '' }];
        let setupOptionCounter = 2;

        // DOM Elements
        const screens = {
            loading: document.getElementById('screen-loading'),
            setup: document.getElementById('screen-setup'),
            voting: document.getElementById('screen-voting'),
            results: document.getElementById('screen-results')
        };
        
        const errorNotification = document.getElementById('error-notification');
        const timerDisplay = document.getElementById('timer-display');
        const timerText = document.getElementById('timer-text');

        // References to Firestore
        // RULE 1: STRICT PATH
        const pollDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'polls', 'main_poll');

        // --- Utility Functions ---

        function showError(msg) {
            errorNotification.textContent = msg;
            errorNotification.classList.remove('hidden');
            setTimeout(() => {
                errorNotification.classList.add('hidden');
            }, 4000);
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            if (screens[screenName]) {
                screens[screenName].classList.remove('hidden');
            }
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        // --- Initialization & Auth ---

        async function init() {
            try {
                // RULE 3: AUTH BEFORE QUERIES
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }

                currentUser = auth.currentUser;
                if (!currentUser) throw new Error("Failed to authenticate.");

                listenToPoll();
            } catch (error) {
                console.error("Auth Error:", error);
                showError("Authentication failed. Please refresh the page.");
                showScreen('setup'); // Fallback purely visual
            }
        }

        // --- Firebase Sync Logic ---

        function listenToPoll() {
            if (pollUnsubscribe) pollUnsubscribe();

            pollUnsubscribe = onSnapshot(pollDocRef, (docSnap) => {
                if (!docSnap.exists()) {
                    // No poll exists yet, start in Setup mode
                    currentPollData = null;
                    renderSetupScreen();
                    showScreen('setup');
                    hideTimer();
                } else {
                    currentPollData = docSnap.data();
                    handlePollStateChange();
                }
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showError("Lost connection to the poll.");
            });
        }

        function handlePollStateChange() {
            if (!currentPollData) return;

            const { status, endTime, voters } = currentPollData;
            
            // Check if user has already voted
            const hasVoted = voters && voters.includes(currentUser.uid);
            
            // Check time
            const now = Date.now();
            const isTimeUp = status === 'active' && now >= endTime;

            if (status === 'setup') {
                renderSetupScreen();
                showScreen('setup');
                hideTimer();
                stopTimer();
            } else if (status === 'active' && !isTimeUp) {
                if (hasVoted) {
                    // Already voted, jump to results (which might update live)
                    renderResultsScreen();
                    showScreen('results');
                } else {
                    // Ready to vote
                    renderVotingScreen();
                    showScreen('voting');
                }
                startTimer(endTime);
            } else if (status === 'finished' || isTimeUp) {
                // Poll is closed
                renderResultsScreen();
                showScreen('results');
                hideTimer();
                stopTimer();
            }
        }

        // --- Timer Logic ---

        function startTimer(endTime) {
            stopTimer();
            timerDisplay.classList.remove('hidden');
            
            const updateTimer = () => {
                const now = Date.now();
                const remaining = Math.max(0, endTime - now);
                
                if (remaining <= 0) {
                    stopTimer();
                    timerText.textContent = "00:00";
                    // If we are looking at the voting screen, shift to results automatically
                    if (!screens.voting.classList.contains('hidden')) {
                         handlePollStateChange(); // Re-evaluate state (isTimeUp will be true)
                    }
                    return;
                }

                const totalSeconds = Math.floor(remaining / 1000);
                const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                timerText.textContent = `${m}:${s}`;
                
                // Add urgent styling if < 10 seconds
                if (totalSeconds <= 10) {
                    timerDisplay.classList.remove('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
                    timerDisplay.classList.add('bg-red-100', 'text-red-700', 'border-red-200', 'animate-pulse');
                } else {
                    timerDisplay.classList.add('bg-indigo-100', 'text-indigo-700', 'border-indigo-200');
                    timerDisplay.classList.remove('bg-red-100', 'text-red-700', 'border-red-200', 'animate-pulse');
                }
            };

            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        function hideTimer() {
            timerDisplay.classList.add('hidden');
        }

        // --- Screen Renders & Interactions ---

        // SETUP SCREEN
        const setupOptionsList = document.getElementById('setup-options-list');
        const btnAddOption = document.getElementById('btn-add-option');
        const btnStartPoll = document.getElementById('btn-start-poll');

        function renderSetupScreen() {
            setupOptionsList.innerHTML = '';
            setupOptions.forEach((opt, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center gap-2 mb-2 group';
                div.innerHTML = `
                    <div class="flex-1 relative">
                        <input type="text" data-id="${opt.id}" value="${opt.text}" placeholder="Option ${index + 1}" class="option-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all pr-10">
                    </div>
                    <button class="remove-option-btn p-2 text-gray-400 hover:text-red-500 transition-colors rounded-lg hover:bg-red-50 focus:outline-none" data-id="${opt.id}" title="Remove Option">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                `;
                setupOptionsList.appendChild(div);
            });

            // Bind events for options
            document.querySelectorAll('.option-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const option = setupOptions.find(o => o.id === id);
                    if (option) option.text = e.target.value;
                });
            });

            document.querySelectorAll('.remove-option-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (setupOptions.length <= 2) {
                        showError("A poll needs at least 2 options.");
                        return;
                    }
                    const id = e.currentTarget.getAttribute('data-id');
                    setupOptions = setupOptions.filter(o => o.id !== id);
                    renderSetupScreen();
                });
            });
        }

        btnAddOption.addEventListener('click', () => {
            if (setupOptions.length >= 10) {
                showError("Maximum 10 options allowed.");
                return;
            }
            setupOptionCounter++;
            setupOptions.push({ id: `opt_${setupOptionCounter}_${generateId()}`, text: '' });
            renderSetupScreen();
            
            // scroll to bottom
            setTimeout(() => {
                setupOptionsList.scrollTop = setupOptionsList.scrollHeight;
            }, 10);
        });

        btnStartPoll.addEventListener('click', async () => {
            if (!currentUser) return;
            
            const question = document.getElementById('setup-question').value.trim() || 'Untitled Poll';
            const validOptions = setupOptions.filter(o => o.text.trim() !== '').map(o => ({ id: o.id, text: o.text.trim() }));
            
            if (validOptions.length < 2) {
                showError("Please provide at least 2 valid options.");
                return;
            }

            const type = document.querySelector('input[name="poll-type"]:checked').value;
            const minutes = parseInt(document.getElementById('setup-minutes').value) || 0;
            const seconds = parseInt(document.getElementById('setup-seconds').value) || 0;
            const totalMs = (minutes * 60 + seconds) * 1000;

            if (totalMs <= 0) {
                showError("Duration must be greater than 0.");
                return;
            }

            btnStartPoll.disabled = true;
            btnStartPoll.textContent = 'Starting...';

            const initialVotes = {};
            validOptions.forEach(opt => initialVotes[opt.id] = 0);

            try {
                await setDoc(pollDocRef, {
                    question: question,
                    status: 'active',
                    type: type,
                    options: validOptions,
                    endTime: Date.now() + totalMs,
                    voters: [],
                    votes: initialVotes
                });
                // Snapshot listener will auto-switch screen
            } catch (err) {
                console.error(err);
                showError("Failed to start poll.");
            } finally {
                btnStartPoll.disabled = false;
                btnStartPoll.textContent = 'Start Poll';
            }
        });

        // VOTING SCREEN
        const votingOptionsContainer = document.getElementById('voting-options-container');
        const btnSubmitVote = document.getElementById('btn-submit-vote');
        
        function renderVotingScreen() {
            if (!currentPollData) return;
            
            document.getElementById('voting-question').textContent = currentPollData.question;
            votingOptionsContainer.innerHTML = '';
            
            const isMultiple = currentPollData.type === 'multiple';
            const inputType = isMultiple ? 'checkbox' : 'radio';

            currentPollData.options.forEach(opt => {
                const label = document.createElement('label');
                label.className = `flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-indigo-50 transition-colors group relative overflow-hidden`;
                
                label.innerHTML = `
                    <div class="flex items-center h-5">
                        <input type="${inputType}" name="voting-option" value="${opt.id}" class="w-5 h-5 text-indigo-600 border-gray-300 focus:ring-indigo-500 ${isMultiple ? 'rounded' : 'rounded-full'} cursor-pointer">
                    </div>
                    <div class="ml-3 text-base font-medium text-gray-800">
                        ${escapeHtml(opt.text)}
                    </div>
                `;
                
                // Add visual toggle effect
                const input = label.querySelector('input');
                input.addEventListener('change', () => updateVotingUISelection());
                
                votingOptionsContainer.appendChild(label);
            });
            
            updateVotingUISelection();
        }

        function updateVotingUISelection() {
            const inputs = document.querySelectorAll('input[name="voting-option"]');
            let hasSelection = false;
            
            inputs.forEach(input => {
                const parent = input.closest('label');
                if (input.checked) {
                    parent.classList.add('border-indigo-500', 'bg-indigo-50');
                    parent.classList.remove('border-gray-200');
                    hasSelection = true;
                } else {
                    parent.classList.remove('border-indigo-500', 'bg-indigo-50');
                    parent.classList.add('border-gray-200');
                }
            });

            btnSubmitVote.disabled = !hasSelection;
        }

        btnSubmitVote.addEventListener('click', async () => {
            if (!currentUser || !currentPollData) return;
            
            const selectedInputs = Array.from(document.querySelectorAll('input[name="voting-option"]:checked'));
            if (selectedInputs.length === 0) return;

            btnSubmitVote.disabled = true;
            btnSubmitVote.textContent = 'Submitting...';

            const selectedIds = selectedInputs.map(input => input.value);

            try {
                // Fetch latest to prevent race conditions on vote count if possible, 
                // but since it's a vibe code, read-modify-write is acceptable.
                const snap = await getDoc(pollDocRef);
                if (!snap.exists()) throw new Error("Poll not found.");
                
                const data = snap.data();
                if (data.status !== 'active' || Date.now() > data.endTime) {
                     showError("Voting is closed.");
                     return;
                }
                if (data.voters.includes(currentUser.uid)) {
                     showError("You have already voted.");
                     return;
                }

                // Increment votes
                const updatedVotes = { ...data.votes };
                selectedIds.forEach(id => {
                    updatedVotes[id] = (updatedVotes[id] || 0) + 1;
                });

                // Add user to voters array
                const updatedVoters = [...data.voters, currentUser.uid];

                await updateDoc(pollDocRef, {
                    votes: updatedVotes,
                    voters: updatedVoters
                });

                // UI will update via snapshot
            } catch (error) {
                console.error(error);
                showError("Failed to submit vote.");
                btnSubmitVote.disabled = false;
                btnSubmitVote.textContent = 'Submit Vote';
            }
        });

        // RESULTS SCREEN
        const resultsContainer = document.getElementById('results-container');
        const btnResetPoll = document.getElementById('btn-reset-poll');

        function renderResultsScreen() {
            if (!currentPollData) return;

            document.getElementById('results-question').textContent = currentPollData.question;
            
            const votes = currentPollData.votes || {};
            const options = currentPollData.options || [];
            
            // Calculate total votes
            let totalVotes = 0;
            Object.values(votes).forEach(count => totalVotes += count);
            
            document.getElementById('results-total-votes').textContent = `${totalVotes} ${totalVotes === 1 ? 'Vote' : 'Votes'}`;

            // Sort options by vote count descending
            const sortedOptions = [...options].sort((a, b) => (votes[b.id] || 0) - (votes[a.id] || 0));

            resultsContainer.innerHTML = '';
            
            // Find max votes for relative bar sizing
            const maxVotes = Math.max(...Object.values(votes), 1); // prevent div by zero

            sortedOptions.forEach(opt => {
                const count = votes[opt.id] || 0;
                const percentage = totalVotes === 0 ? 0 : Math.round((count / totalVotes) * 100);
                const relativeWidth = Math.round((count / maxVotes) * 100); // For bar visual

                const div = document.createElement('div');
                div.className = 'relative';
                
                div.innerHTML = `
                    <div class="flex justify-between items-end mb-1">
                        <span class="text-sm font-semibold text-gray-800">${escapeHtml(opt.text)}</span>
                        <span class="text-sm font-bold text-gray-600">${percentage}%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div class="bg-indigo-500 h-3 rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">${count} vote${count !== 1 ? 's' : ''}</p>
                `;
                
                resultsContainer.appendChild(div);

                // Animate bar
                setTimeout(() => {
                    const bar = div.querySelector('.bg-indigo-500');
                    if (bar) bar.style.width = `${relativeWidth}%`;
                }, 50);
            });
        }

        btnResetPoll.addEventListener('click', async () => {
            if (!currentUser) return;
            try {
                btnResetPoll.disabled = true;
                btnResetPoll.textContent = "Resetting...";
                
                // Overwrite the document to setup state
                await setDoc(pollDocRef, {
                    status: 'setup'
                });
            } catch (err) {
                console.error(err);
                showError("Failed to reset poll.");
            } finally {
                btnResetPoll.disabled = false;
                btnResetPoll.textContent = "Create New Poll";
            }
        });


        // Simple HTML escaper to prevent XSS in option text
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Start App
